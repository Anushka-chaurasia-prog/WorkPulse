services:
  # -------------------------------------------------------------------
  # MySQL Relational Database
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: workpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-employee_management}
      MYSQL_USER: ${DB_USERNAME:-employee_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-EmployeeApp@123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPass@123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - workpulse-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # -------------------------------------------------------------------
  # Spring Boot Backend REST API
  # -------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workpulse-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-employee_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-employee_app}
      DB_PASSWORD: ${DB_PASSWORD:-EmployeeApp@123}
      JWT_SECRET: ${JWT_SECRET:-c3VwZXJzZWNyZXRqd3RrZXlmb3JlbXBsb3llZW1hbmFnZW1lbnRzeXN0ZW0yMDI2IWtleQ==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - workpulse-net

  # -------------------------------------------------------------------
  # React Production Frontend (Served via Nginx)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: workpulse-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - workpulse-net

# -------------------------------------------------------------------
# Persistent Storage & Network Definitions
# -------------------------------------------------------------------
volumes:
  mysql_data:
    name: workpulse_mysql_data

networks:
  workpulse-net:
    name: workpulse_network
